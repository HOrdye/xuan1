<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>筊杯3D预览 - 修复版</title>
    <script src="https://unpkg.com/three@0.158.0/build/three.min.js"></script>
    <style>
        body {
            margin: 0;
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            font-family: 'Microsoft YaHei', sans-serif;
            color: white;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        .header {
            text-align: center;
            margin-bottom: 30px;
        }
        .preview-section {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
        }
        .preview-card {
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            padding: 20px;
        }
        .canvas-container {
            width: 100%;
            height: 400px;
            border-radius: 10px;
            overflow: hidden;
            background: #1a1a2e;
            position: relative;
        }
        .loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            color: #fff;
        }
        .error {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            color: #ff6b6b;
            background: rgba(0,0,0,0.8);
            padding: 20px;
            border-radius: 10px;
        }
        .controls {
            margin-top: 20px;
            text-align: center;
        }
        .btn {
            background: linear-gradient(45deg, #ff6b6b, #ee5a24);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 25px;
            font-size: 16px;
            cursor: pointer;
            margin: 0 10px;
            transition: all 0.3s ease;
        }
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }
        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }
        .status {
            margin-top: 10px;
            padding: 10px;
            background: rgba(0,0,0,0.3);
            border-radius: 5px;
            font-size: 12px;
        }
        .result-display {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(0,0,0,0.8);
            padding: 15px;
            border-radius: 10px;
            font-size: 14px;
            min-width: 120px;
        }
        .result-item {
            display: flex;
            justify-content: space-between;
            margin-bottom: 5px;
        }
        .result-item:last-child {
            margin-bottom: 0;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🥤 筊杯3D预览 - 修复版</h1>
            <p>传统筊杯设计优化 - 清晰的平面与凸面区分</p>
        </div>
        
        <div class="preview-section">
            <div class="preview-card">
                <h3>🎯 当前设计（问题版本）</h3>
                <div class="canvas-container">
                    <div id="currentCanvas">
                        <div class="loading">加载中...</div>
                    </div>
                    <div class="result-display">
                        <div class="result-item">
                            <span>筊杯1:</span>
                            <span id="currentResult1">待投掷</span>
                        </div>
                        <div class="result-item">
                            <span>筊杯2:</span>
                            <span id="currentResult2">待投掷</span>
                        </div>
                        <div class="result-item">
                            <span>结果:</span>
                            <span id="currentFinalResult">-</span>
                        </div>
                    </div>
                </div>
                <div class="controls">
                    <button class="btn" id="currentThrowBtn" onclick="throwCurrent()" disabled>投掷测试</button>
                    <button class="btn" id="currentResetBtn" onclick="resetCurrent()" disabled>重置</button>
                </div>
                <div class="status" id="currentStatus">状态: 初始化中...</div>
            </div>
            
            <div class="preview-card">
                <h3>✨ 改进设计（新版本）</h3>
                <div class="canvas-container">
                    <div id="improvedCanvas">
                        <div class="loading">加载中...</div>
                    </div>
                    <div class="result-display">
                        <div class="result-item">
                            <span>筊杯1:</span>
                            <span id="improvedResult1">待投掷</span>
                        </div>
                        <div class="result-item">
                            <span>筊杯2:</span>
                            <span id="improvedResult2">待投掷</span>
                        </div>
                        <div class="result-item">
                            <span>结果:</span>
                            <span id="improvedFinalResult">-</span>
                        </div>
                    </div>
                </div>
                <div class="controls">
                    <button class="btn" id="improvedThrowBtn" onclick="throwImproved()" disabled>投掷测试</button>
                    <button class="btn" id="improvedResetBtn" onclick="resetImproved()" disabled>重置</button>
                </div>
                <div class="status" id="improvedStatus">状态: 初始化中...</div>
            </div>
        </div>
    </div>

    <script>
        // 全局变量
        let currentScene, currentCamera, currentRenderer, currentJiaoBei = [];
        let improvedScene, improvedCamera, improvedRenderer, improvedJiaoBei = [];
        let isCurrentReady = false;
        let isImprovedReady = false;
        
        // 检查WebGL支持
        function checkWebGL() {
            try {
                const canvas = document.createElement('canvas');
                const gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');
                if (!gl) {
                    throw new Error('WebGL not supported');
                }
                return true;
            } catch (e) {
                console.error('WebGL不支持:', e);
                return false;
            }
        }
        
        // 检查Three.js是否正确加载
        function checkThreeJS() {
            if (typeof THREE === 'undefined') {
                console.error('Three.js 未加载！');
                return false;
            }
            console.log('Three.js 加载成功');
            return true;
        }
        
        // 显示错误信息
        function showError(containerId, message) {
            const container = document.getElementById(containerId);
            container.innerHTML = `<div class="error">${message}</div>`;
        }
        
        // 初始化当前设计
        function initCurrent() {
            console.log('开始初始化当前设计...');
            
            if (!checkWebGL()) {
                showError('currentCanvas', '您的浏览器不支持WebGL，无法显示3D内容');
                return;
            }
            
            if (!checkThreeJS()) {
                showError('currentCanvas', 'Three.js库加载失败，请检查网络连接');
                return;
            }
            
            const container = document.getElementById('currentCanvas');
            if (!container) {
                console.error('找不到 currentCanvas 容器');
                return;
            }
            
            try {
                // 清除加载提示
                container.innerHTML = '';
                
                // 创建场景
                currentScene = new THREE.Scene();
                currentScene.background = new THREE.Color(0x1a1a2e);
                
                // 创建相机
                currentCamera = new THREE.PerspectiveCamera(60, container.clientWidth / container.clientHeight, 0.1, 1000);
                currentCamera.position.set(0, 8, 12);
                currentCamera.lookAt(0, 0, 0);
                
                // 创建渲染器
                currentRenderer = new THREE.WebGLRenderer({ 
                    antialias: true,
                    alpha: true
                });
                currentRenderer.setSize(container.clientWidth, container.clientHeight);
                currentRenderer.shadowMap.enabled = true;
                currentRenderer.shadowMap.type = THREE.PCFSoftShadowMap;
                container.appendChild(currentRenderer.domElement);
                
                // 添加光源
                const ambientLight = new THREE.AmbientLight(0x404040, 0.6);
                currentScene.add(ambientLight);
                
                const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
                directionalLight.position.set(10, 15, 10);
                directionalLight.castShadow = true;
                currentScene.add(directionalLight);
                
                // 创建地面
                const groundGeometry = new THREE.PlaneGeometry(20, 20);
                const groundMaterial = new THREE.MeshLambertMaterial({ color: 0x8b4513 });
                const ground = new THREE.Mesh(groundGeometry, groundMaterial);
                ground.rotation.x = -Math.PI / 2;
                ground.position.y = -2;
                ground.receiveShadow = true;
                currentScene.add(ground);
                
                // 创建筊杯
                createCurrentJiaoBei();
                
                // 开始动画
                animateCurrent();
                
                // 启用按钮
                document.getElementById('currentThrowBtn').disabled = false;
                document.getElementById('currentResetBtn').disabled = false;
                document.getElementById('currentStatus').textContent = '状态: 已就绪';
                
                isCurrentReady = true;
                console.log('当前设计初始化完成');
                
            } catch (error) {
                console.error('初始化当前设计失败:', error);
                showError('currentCanvas', `初始化失败: ${error.message}`);
            }
        }
        
        // 创建当前设计的筊杯
        function createCurrentJiaoBei() {
            for (let i = 0; i < 2; i++) {
                const group = new THREE.Group();
                
                // 问题版本：平面和凸面区分不够明显
                const geometry = new THREE.BufferGeometry();
                const vertices = new Float32Array([
                    -1.0, 0, -0.5,  0.0, 0, -0.8,  1.0, 0, -0.5,  1.0, 0, 0.5,  0.0, 0, 0.8,  -1.0, 0, 0.5,
                    -0.7, 0.4, -0.3,  0.0, 0.4, -0.5,  0.7, 0.4, -0.3,  0.7, 0.4, 0.3,  0.0, 0.4, 0.5,  -0.7, 0.4, 0.3
                ]);
                
                const indices = new Uint16Array([
                    0, 1, 2,  0, 2, 3,  0, 3, 4,  0, 4, 5,
                    6, 11, 10,  6, 10, 9,  6, 9, 8,  6, 8, 7,
                    0, 6, 7,  0, 7, 1,  1, 7, 8,  1, 8, 2,
                    2, 8, 9,  2, 9, 3,  3, 9, 10,  3, 10, 4,
                    4, 10, 11,  4, 11, 5,  5, 11, 6,  5, 6, 0
                ]);
                
                geometry.setAttribute('position', new THREE.BufferAttribute(vertices, 3));
                geometry.setIndex(new THREE.BufferAttribute(indices, 1));
                geometry.computeVertexNormals();
                
                const material = new THREE.MeshPhongMaterial({ color: 0xdc2626 });
                const mesh = new THREE.Mesh(geometry, material);
                mesh.castShadow = true;
                group.add(mesh);
                
                group.position.set(i * 1.5 - 0.75, 2, 0);
                currentScene.add(group);
                currentJiaoBei.push(group);
            }
        }
        
        // 初始化改进设计
        function initImproved() {
            console.log('开始初始化改进设计...');
            
            if (!checkWebGL()) {
                showError('improvedCanvas', '您的浏览器不支持WebGL，无法显示3D内容');
                return;
            }
            
            if (!checkThreeJS()) {
                showError('improvedCanvas', 'Three.js库加载失败，请检查网络连接');
                return;
            }
            
            const container = document.getElementById('improvedCanvas');
            if (!container) {
                console.error('找不到 improvedCanvas 容器');
                return;
            }
            
            try {
                // 清除加载提示
                container.innerHTML = '';
                
                // 创建场景
                improvedScene = new THREE.Scene();
                improvedScene.background = new THREE.Color(0x1a1a2e);
                
                // 创建相机
                improvedCamera = new THREE.PerspectiveCamera(60, container.clientWidth / container.clientHeight, 0.1, 1000);
                improvedCamera.position.set(0, 8, 12);
                improvedCamera.lookAt(0, 0, 0);
                
                // 创建渲染器
                improvedRenderer = new THREE.WebGLRenderer({ 
                    antialias: true,
                    alpha: true
                });
                improvedRenderer.setSize(container.clientWidth, container.clientHeight);
                improvedRenderer.shadowMap.enabled = true;
                improvedRenderer.shadowMap.type = THREE.PCFSoftShadowMap;
                container.appendChild(improvedRenderer.domElement);
                
                // 添加光源
                const ambientLight = new THREE.AmbientLight(0x404040, 0.6);
                improvedScene.add(ambientLight);
                
                const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
                directionalLight.position.set(10, 15, 10);
                directionalLight.castShadow = true;
                improvedScene.add(directionalLight);
                
                // 创建地面
                const groundGeometry = new THREE.PlaneGeometry(20, 20);
                const groundMaterial = new THREE.MeshLambertMaterial({ color: 0x8b4513 });
                const ground = new THREE.Mesh(groundGeometry, groundMaterial);
                ground.rotation.x = -Math.PI / 2;
                ground.position.y = -2;
                ground.receiveShadow = true;
                improvedScene.add(ground);
                
                // 创建筊杯
                createImprovedJiaoBei();
                
                // 开始动画
                animateImproved();
                
                // 启用按钮
                document.getElementById('improvedThrowBtn').disabled = false;
                document.getElementById('improvedResetBtn').disabled = false;
                document.getElementById('improvedStatus').textContent = '状态: 已就绪';
                
                isImprovedReady = true;
                console.log('改进设计初始化完成');
                
            } catch (error) {
                console.error('初始化改进设计失败:', error);
                showError('improvedCanvas', `初始化失败: ${error.message}`);
            }
        }
        
        // 创建改进设计的筊杯
        function createImprovedJiaoBei() {
            for (let i = 0; i < 2; i++) {
                const group = new THREE.Group();
                
                // 改进版本：更清晰的平面和凸面区分
                const geometry = new THREE.BufferGeometry();
                const vertices = new Float32Array([
                    // 底面（平面）- 完全平坦，面积更大
                    -1.2, 0, -0.8,  0.0, 0, -1.0,  1.2, 0, -0.8,  1.2, 0, 0.8,  0.0, 0, 1.0,  -1.2, 0, 0.8,
                    // 顶面（凸面）- 明显凸起，面积较小
                    -0.6, 0.6, -0.4,  0.0, 0.6, -0.6,  0.6, 0.6, -0.4,  0.6, 0.6, 0.4,  0.0, 0.6, 0.6,  -0.6, 0.6, 0.4
                ]);
                
                const indices = new Uint16Array([
                    0, 1, 2,  0, 2, 3,  0, 3, 4,  0, 4, 5,
                    6, 11, 10,  6, 10, 9,  6, 9, 8,  6, 8, 7,
                    0, 6, 7,  0, 7, 1,  1, 7, 8,  1, 8, 2,
                    2, 8, 9,  2, 9, 3,  3, 9, 10,  3, 10, 4,
                    4, 10, 11,  4, 11, 5,  5, 11, 6,  5, 6, 0
                ]);
                
                geometry.setAttribute('position', new THREE.BufferAttribute(vertices, 3));
                geometry.setIndex(new THREE.BufferAttribute(indices, 1));
                geometry.computeVertexNormals();
                
                const material = new THREE.MeshPhongMaterial({ 
                    color: 0xdc2626,
                    shininess: 100,
                    specular: 0x444444
                });
                const mesh = new THREE.Mesh(geometry, material);
                mesh.castShadow = true;
                group.add(mesh);
                
                // 更明显的标识
                const flatIndicator = new THREE.Mesh(
                    new THREE.CircleGeometry(0.2, 16),
                    new THREE.MeshBasicMaterial({ color: 0xffd700, transparent: true, opacity: 0.9 })
                );
                flatIndicator.rotation.x = -Math.PI / 2;
                flatIndicator.position.y = 0.65;
                group.add(flatIndicator);
                
                const convexIndicator = new THREE.Mesh(
                    new THREE.CircleGeometry(0.15, 16),
                    new THREE.MeshBasicMaterial({ color: 0xffd700, transparent: true, opacity: 0.9 })
                );
                convexIndicator.rotation.x = Math.PI / 2;
                convexIndicator.position.y = 0.65;
                group.add(convexIndicator);
                
                group.position.set(i * 1.5 - 0.75, 2, 0);
                improvedScene.add(group);
                improvedJiaoBei.push(group);
            }
        }
        
        // 投掷当前设计
        function throwCurrent() {
            if (!isCurrentReady) {
                console.error('当前设计未就绪');
                return;
            }
            
            console.log('投掷当前设计筊杯');
            document.getElementById('currentStatus').textContent = '状态: 投掷中...';
            
            currentJiaoBei.forEach((jiaoBei, index) => {
                const rotationX = (Math.random() - 0.5) * Math.PI * 2;
                const rotationY = (Math.random() - 0.5) * Math.PI * 2;
                const rotationZ = (Math.random() - 0.5) * Math.PI * 2;
                jiaoBei.rotation.set(rotationX, rotationY, rotationZ);
                
                // 更新结果显示
                const isFlat = Math.abs(rotationY) < Math.PI / 6;
                document.getElementById(`currentResult${index + 1}`).textContent = isFlat ? '平面' : '凸面';
                console.log(`筊杯${index + 1} 旋转:`, { x: rotationX, y: rotationY, z: rotationZ });
            });
            
            // 判断最终结果
            const result1 = Math.abs(currentJiaoBei[0].rotation.y) < Math.PI / 6;
            const result2 = Math.abs(currentJiaoBei[1].rotation.y) < Math.PI / 6;
            
            let finalResult;
            if (result1 && result2) {
                finalResult = '笑杯';
            } else if (!result1 && !result2) {
                finalResult = '阴杯';
            } else {
                finalResult = '圣杯';
            }
            
            document.getElementById('currentFinalResult').textContent = finalResult;
            document.getElementById('currentStatus').textContent = `状态: 投掷完成 - ${finalResult}`;
        }
        
        // 投掷改进设计
        function throwImproved() {
            if (!isImprovedReady) {
                console.error('改进设计未就绪');
                return;
            }
            
            console.log('投掷改进设计筊杯');
            document.getElementById('improvedStatus').textContent = '状态: 投掷中...';
            
            improvedJiaoBei.forEach((jiaoBei, index) => {
                const rotationX = (Math.random() - 0.5) * Math.PI * 2;
                const rotationY = (Math.random() - 0.5) * Math.PI * 2;
                const rotationZ = (Math.random() - 0.5) * Math.PI * 2;
                jiaoBei.rotation.set(rotationX, rotationY, rotationZ);
                
                // 更新结果显示
                const isFlat = Math.abs(rotationY) < Math.PI / 6;
                document.getElementById(`improvedResult${index + 1}`).textContent = isFlat ? '平面' : '凸面';
                console.log(`筊杯${index + 1} 旋转:`, { x: rotationX, y: rotationY, z: rotationZ });
            });
            
            // 判断最终结果
            const result1 = Math.abs(improvedJiaoBei[0].rotation.y) < Math.PI / 6;
            const result2 = Math.abs(improvedJiaoBei[1].rotation.y) < Math.PI / 6;
            
            let finalResult;
            if (result1 && result2) {
                finalResult = '笑杯';
            } else if (!result1 && !result2) {
                finalResult = '阴杯';
            } else {
                finalResult = '圣杯';
            }
            
            document.getElementById('improvedFinalResult').textContent = finalResult;
            document.getElementById('improvedStatus').textContent = `状态: 投掷完成 - ${finalResult}`;
        }
        
        // 重置当前设计
        function resetCurrent() {
            if (!isCurrentReady) return;
            
            console.log('重置当前设计');
            currentJiaoBei.forEach(jiaoBei => {
                jiaoBei.rotation.set(0, 0, 0);
            });
            document.getElementById('currentResult1').textContent = '待投掷';
            document.getElementById('currentResult2').textContent = '待投掷';
            document.getElementById('currentFinalResult').textContent = '-';
            document.getElementById('currentStatus').textContent = '状态: 已重置';
        }
        
        // 重置改进设计
        function resetImproved() {
            if (!isImprovedReady) return;
            
            console.log('重置改进设计');
            improvedJiaoBei.forEach(jiaoBei => {
                jiaoBei.rotation.set(0, 0, 0);
            });
            document.getElementById('improvedResult1').textContent = '待投掷';
            document.getElementById('improvedResult2').textContent = '待投掷';
            document.getElementById('improvedFinalResult').textContent = '-';
            document.getElementById('improvedStatus').textContent = '状态: 已重置';
        }
        
        // 动画循环
        function animateCurrent() {
            if (!isCurrentReady) return;
            
            requestAnimationFrame(animateCurrent);
            const time = Date.now() * 0.001;
            currentCamera.position.x = Math.sin(time * 0.5) * 0.3;
            currentCamera.position.z = 12 + Math.cos(time * 0.3) * 0.2;
            currentCamera.lookAt(0, 0, 0);
            currentRenderer.render(currentScene, currentCamera);
        }
        
        function animateImproved() {
            if (!isImprovedReady) return;
            
            requestAnimationFrame(animateImproved);
            const time = Date.now() * 0.001;
            improvedCamera.position.x = Math.sin(time * 0.5) * 0.3;
            improvedCamera.position.z = 12 + Math.cos(time * 0.3) * 0.2;
            improvedCamera.lookAt(0, 0, 0);
            improvedRenderer.render(improvedScene, improvedCamera);
        }
        
        // 窗口大小变化处理
        function handleResize() {
            if (isCurrentReady && currentCamera && currentRenderer) {
                const container = document.getElementById('currentCanvas');
                currentCamera.aspect = container.clientWidth / container.clientHeight;
                currentCamera.updateProjectionMatrix();
                currentRenderer.setSize(container.clientWidth, container.clientHeight);
            }
            
            if (isImprovedReady && improvedCamera && improvedRenderer) {
                const container = document.getElementById('improvedCanvas');
                improvedCamera.aspect = container.clientWidth / container.clientHeight;
                improvedCamera.updateProjectionMatrix();
                improvedRenderer.setSize(container.clientWidth, container.clientHeight);
            }
        }
        
        // 初始化
        window.addEventListener('load', () => {
            console.log('页面加载完成，开始初始化...');
            
            // 延迟初始化，确保DOM和Three.js都准备好
            setTimeout(() => {
                initCurrent();
                initImproved();
            }, 500);
            
            window.addEventListener('resize', handleResize);
        });
    </script>
</body>
</html>
