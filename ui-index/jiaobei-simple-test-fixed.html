<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>筊杯3D测试 - 修复版</title>
    
    <!-- 尝试多个CDN源 -->
    <script>
        // 动态加载Three.js，尝试多个CDN源
        function loadThreeJS() {
            const sources = [
                'https://cdnjs.cloudflare.com/ajax/libs/three.js/r158/three.min.js',
                'https://unpkg.com/three@0.158.0/build/three.min.js',
                'https://cdn.jsdelivr.net/npm/three@0.158.0/build/three.min.js',
                'https://fastly.jsdelivr.net/npm/three@0.158.0/build/three.min.js'
            ];
            
            let currentIndex = 0;
            
            function tryLoad() {
                if (currentIndex >= sources.length) {
                    console.error('所有CDN源都失败了');
                    document.getElementById('status').textContent = '错误: 无法加载Three.js，请检查网络连接';
                    return;
                }
                
                const script = document.createElement('script');
                script.src = sources[currentIndex];
                script.onload = () => {
                    console.log(`Three.js 从 ${sources[currentIndex]} 加载成功`);
                    document.getElementById('status').textContent = 'Three.js 加载成功，开始初始化...';
                    init();
                };
                script.onerror = () => {
                    console.warn(`CDN源 ${sources[currentIndex]} 失败，尝试下一个...`);
                    currentIndex++;
                    tryLoad();
                };
                
                document.head.appendChild(script);
            }
            
            tryLoad();
        }
    </script>
    
    <style>
        body {
            margin: 0;
            padding: 20px;
            background: #1a1a2e;
            color: white;
            font-family: Arial, sans-serif;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            text-align: center;
        }
        #canvas {
            width: 100%;
            height: 400px;
            border: 2px solid #333;
            border-radius: 10px;
            margin: 20px 0;
            background: #2c3e50;
            position: relative;
            overflow: hidden;
        }
        
        #canvas canvas {
            display: block;
            width: 100% !important;
            height: 100% !important;
        }
        .controls {
            margin: 20px 0;
        }
        button {
            background: #ff6b6b;
            color: white;
            border: none;
            padding: 10px 20px;
            margin: 0 10px;
            border-radius: 5px;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        button:hover {
            background: #ee5a24;
            transform: translateY(-2px);
        }
        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            background: #666;
        }
        .status {
            margin: 20px 0;
            padding: 10px;
            background: rgba(255,255,255,0.1);
            border-radius: 5px;
            min-height: 20px;
        }
        .debug {
            margin: 10px 0;
            padding: 8px;
            background: rgba(0,0,0,0.3);
            border-radius: 3px;
            font-size: 12px;
            text-align: left;
        }
        .loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
        }
        .spinner {
            border: 4px solid rgba(255,255,255,0.3);
            border-top: 4px solid #ff6b6b;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 10px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🥤 筊杯3D测试 - 修复版</h1>
        <div class="status" id="status">正在加载Three.js...</div>
        <div id="canvas">
            <div class="loading">
                <div class="spinner"></div>
                <div>加载中...</div>
            </div>
        </div>
        <div class="controls">
            <button id="throwBtn" onclick="throwJiaoBei()" disabled>投掷筊杯</button>
            <button id="resetBtn" onclick="resetJiaoBei()" disabled>重置</button>
        </div>
        <div class="debug" id="debug">等待初始化...</div>
    </div>

    <script>
        let scene, camera, renderer, jiaoBei = [];
        let isInitialized = false;
        
        function updateStatus(message) {
            document.getElementById('status').textContent = message;
            console.log(message);
        }
        
        function updateDebug(message) {
            document.getElementById('debug').textContent = message;
            console.log('Debug:', message);
        }
        
        function init() {
            updateStatus('开始初始化...');
            
            try {
                // 检查Three.js
                if (typeof THREE === 'undefined') {
                    updateStatus('错误: Three.js 未加载');
                    return;
                }
                
                updateDebug(`Three.js 版本: ${THREE.REVISION}`);
                
                // 检查WebGL
                const canvas = document.createElement('canvas');
                const gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');
                if (!gl) {
                    updateStatus('错误: WebGL 不支持');
                    updateDebug('请使用支持WebGL的现代浏览器（Chrome、Firefox、Edge）');
                    return;
                }
                
                updateDebug('WebGL 支持正常');
                
                // 获取容器
                const container = document.getElementById('canvas');
                if (!container) {
                    updateStatus('错误: 找不到容器');
                    return;
                }
                
                // 清除加载提示
                container.innerHTML = '';
                
                // 创建场景
                scene = new THREE.Scene();
                scene.background = new THREE.Color(0x2c3e50);
                
                // 创建相机
                camera = new THREE.PerspectiveCamera(75, container.clientWidth / container.clientHeight, 0.1, 1000);
                camera.position.set(0, 5, 10);
                camera.lookAt(0, 0, 0);
                
                        // 创建渲染器
        renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(container.clientWidth, container.clientHeight);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        
        // 确保canvas元素正确添加到容器
        const canvasElement = renderer.domElement;
        canvasElement.style.width = '100%';
        canvasElement.style.height = '100%';
        container.appendChild(canvasElement);
        
        // 强制重新计算容器尺寸
        container.style.position = 'relative';
        container.style.overflow = 'hidden';
                
                        // 添加光源
        const ambientLight = new THREE.AmbientLight(0x404040, 0.8);
        scene.add(ambientLight);
        
        const directionalLight = new THREE.DirectionalLight(0xffffff, 1.0);
        directionalLight.position.set(5, 10, 5);
        directionalLight.castShadow = true;
        directionalLight.shadow.mapSize.width = 1024;
        directionalLight.shadow.mapSize.height = 1024;
        scene.add(directionalLight);
        
        // 添加点光源增强可见性
        const pointLight = new THREE.PointLight(0xffffff, 0.5, 20);
        pointLight.position.set(0, 8, 0);
        scene.add(pointLight);
                
                // 添加地面
                const groundGeometry = new THREE.PlaneGeometry(10, 10);
                const groundMaterial = new THREE.MeshLambertMaterial({ color: 0x8b4513 });
                const ground = new THREE.Mesh(groundGeometry, groundMaterial);
                ground.rotation.x = -Math.PI / 2;
                ground.position.y = -1;
                ground.receiveShadow = true;
                scene.add(ground);
                
                        // 创建筊杯
        createJiaoBei();
        
        // 启动动画
        animate();
        
        isInitialized = true;
        updateStatus('初始化完成！可以投掷筊杯了');
        updateDebug(`场景对象: ${scene.children.length}, 筊杯: ${jiaoBei.length}`);
        
        // 强制渲染一次确保可见
        if (renderer && scene && camera) {
            renderer.render(scene, camera);
        }
        
        // 启用按钮
        document.getElementById('throwBtn').disabled = false;
        document.getElementById('resetBtn').disabled = false;
                
            } catch (error) {
                updateStatus('初始化失败: ' + error.message);
                updateDebug('错误详情: ' + error.stack);
                console.error('初始化失败:', error);
            }
        }
        
        function createJiaoBei() {
            jiaoBei = [];
            
            for (let i = 0; i < 2; i++) {
                const group = new THREE.Group();
                
                        // 筊杯主体 - 立方体
        const geometry = new THREE.BoxGeometry(0.8, 0.6, 0.8);
        const material = new THREE.MeshPhongMaterial({ 
            color: 0xe74c3c,
            transparent: false,
            opacity: 1.0
        });
        const mesh = new THREE.Mesh(geometry, material);
        mesh.castShadow = true;
        mesh.receiveShadow = true;
        group.add(mesh);
                
                        // 平面标识 - 金色圆盘
        const flatIndicator = new THREE.Mesh(
            new THREE.CircleGeometry(0.25, 16),
            new THREE.MeshBasicMaterial({ color: 0xf1c40f })
        );
        flatIndicator.rotation.x = -Math.PI / 2;
        flatIndicator.position.y = 0.4;
        group.add(flatIndicator);
        
        // 凸面标识 - 红色小球
        const convexIndicator = new THREE.Mesh(
            new THREE.SphereGeometry(0.15, 8, 6),
            new THREE.MeshBasicMaterial({ color: 0xff6b6b })
        );
        convexIndicator.position.y = -0.4;
        group.add(convexIndicator);
                
                        // 设置位置
        group.position.set(i * 1.2 - 0.6, 1, 0);
        scene.add(group);
        jiaoBei.push(group);
        
        // 确保筊杯可见
        group.traverse((child) => {
            if (child.isMesh) {
                child.material.needsUpdate = true;
            }
        });
            }
            
            updateDebug(`创建了 ${jiaoBei.length} 个筊杯`);
        }
        
        function throwJiaoBei() {
            if (!isInitialized || jiaoBei.length === 0) {
                updateStatus('筊杯未初始化，无法投掷');
                return;
            }
            
            updateStatus('投掷筊杯中...');
            
            jiaoBei.forEach((jiaoBei, index) => {
                const rotationX = (Math.random() - 0.5) * Math.PI * 2;
                const rotationY = (Math.random() - 0.5) * Math.PI * 2;
                const rotationZ = (Math.random() - 0.5) * Math.PI * 2;
                
                jiaoBei.rotation.set(rotationX, rotationY, rotationZ);
                
                updateDebug(`筊杯${index + 1} 旋转: X=${rotationX.toFixed(2)}, Y=${rotationY.toFixed(2)}, Z=${rotationZ.toFixed(2)}`);
            });
            
            updateStatus('投掷完成！');
        }
        
        function resetJiaoBei() {
            if (!isInitialized || jiaoBei.length === 0) {
                updateStatus('筊杯未初始化，无法重置');
                return;
            }
            
            jiaoBei.forEach(jiaoBei => {
                jiaoBei.rotation.set(0, 0, 0);
            });
            
            updateStatus('筊杯已重置');
            updateDebug('所有筊杯旋转已归零');
        }
        
        function animate() {
            if (!isInitialized) return;
            
            requestAnimationFrame(animate);
            
            // 相机轻微移动
            const time = Date.now() * 0.001;
            camera.position.x = Math.sin(time * 0.5) * 0.5;
            camera.position.z = 10 + Math.cos(time * 0.3) * 0.3;
            camera.lookAt(0, 0, 0);
            
                    // 渲染场景
        if (renderer && scene && camera) {
            renderer.render(scene, camera);
        }
        
        // 添加调试信息
        if (jiaoBei.length > 0) {
            const jiaoBei1 = jiaoBei[0];
            const jiaoBei2 = jiaoBei[1];
            if (jiaoBei1 && jiaoBei2) {
                updateDebug(`筊杯1 旋转: X=${jiaoBei1.rotation.x.toFixed(2)}, Y=${jiaoBei1.rotation.y.toFixed(2)}, Z=${jiaoBei1.rotation.z.toFixed(2)}`);
                updateDebug(`筊杯2 旋转: X=${jiaoBei2.rotation.x.toFixed(2)}, Y=${jiaoBei2.rotation.y.toFixed(2)}, Z=${jiaoBei2.rotation.z.toFixed(2)}`);
            }
        }
        }
        
        // 页面加载完成后开始加载Three.js
        window.addEventListener('load', () => {
            updateStatus('页面加载完成，开始加载Three.js...');
            loadThreeJS();
            
            // 添加一个延迟检查，确保渲染正常
            setTimeout(() => {
                if (isInitialized && renderer && scene && camera) {
                    updateDebug('延迟检查：强制重新渲染场景');
                    renderer.render(scene, camera);
                }
            }, 3000);
        });
        
        // 窗口大小改变时重新调整渲染器大小
        window.addEventListener('resize', () => {
            if (renderer && camera) {
                const container = document.getElementById('canvas');
                camera.aspect = container.clientWidth / container.clientHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(container.clientWidth, container.clientHeight);
            }
        });
    </script>
</body>
</html>
