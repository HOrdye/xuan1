<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>筊杯3D简单测试</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r158/three.min.js"></script>
    <style>
        body {
            margin: 0;
            padding: 20px;
            background: #1a1a2e;
            color: white;
            font-family: Arial, sans-serif;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            text-align: center;
        }
        #canvas {
            width: 100%;
            height: 400px;
            border: 2px solid #333;
            border-radius: 10px;
            margin: 20px 0;
        }
        .controls {
            margin: 20px 0;
        }
        button {
            background: #ff6b6b;
            color: white;
            border: none;
            padding: 10px 20px;
            margin: 0 10px;
            border-radius: 5px;
            cursor: pointer;
        }
        button:hover {
            background: #ee5a24;
        }
        .status {
            margin: 20px 0;
            padding: 10px;
            background: rgba(255,255,255,0.1);
            border-radius: 5px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🥤 筊杯3D简单测试</h1>
        <div class="status" id="status">等待初始化...</div>
        <div id="canvas"></div>
        <div class="controls">
            <button onclick="throwJiaoBei()">投掷筊杯</button>
            <button onclick="resetJiaoBei()">重置</button>
        </div>
        <div class="status" id="debug"></div>
    </div>

    <script>
        let scene, camera, renderer, jiaoBei = [];
        let isInitialized = false;
        
        function updateStatus(message) {
            document.getElementById('status').textContent = message;
            console.log(message);
        }
        
        function updateDebug(message) {
            document.getElementById('debug').textContent = message;
            console.log('Debug:', message);
        }
        
        function init() {
            updateStatus('开始初始化...');
            
            try {
                // 检查Three.js
                if (typeof THREE === 'undefined') {
                    updateStatus('错误: Three.js 未加载');
                    return;
                }
                
                updateDebug(`Three.js 版本: ${THREE.REVISION}`);
                
                // 检查WebGL
                const canvas = document.createElement('canvas');
                const gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');
                if (!gl) {
                    updateStatus('错误: WebGL 不支持');
                    return;
                }
                
                updateDebug('WebGL 支持正常');
                
                // 获取容器
                const container = document.getElementById('canvas');
                if (!container) {
                    updateStatus('错误: 找不到容器');
                    return;
                }
                
                // 创建场景
                scene = new THREE.Scene();
                scene.background = new THREE.Color(0x2c3e50);
                
                // 创建相机
                camera = new THREE.PerspectiveCamera(75, container.clientWidth / container.clientHeight, 0.1, 1000);
                camera.position.set(0, 5, 10);
                camera.lookAt(0, 0, 0);
                
                // 创建渲染器
                renderer = new THREE.WebGLRenderer({ antialias: true });
                renderer.setSize(container.clientWidth, container.clientHeight);
                renderer.shadowMap.enabled = true;
                container.appendChild(renderer.domElement);
                
                // 添加光源
                const ambientLight = new THREE.AmbientLight(0x404040, 0.6);
                scene.add(ambientLight);
                
                const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
                directionalLight.position.set(5, 10, 5);
                directionalLight.castShadow = true;
                scene.add(directionalLight);
                
                // 添加地面
                const groundGeometry = new THREE.PlaneGeometry(10, 10);
                const groundMaterial = new THREE.MeshLambertMaterial({ color: 0x8b4513 });
                const ground = new THREE.Mesh(groundGeometry, groundMaterial);
                ground.rotation.x = -Math.PI / 2;
                ground.position.y = -1;
                ground.receiveShadow = true;
                scene.add(ground);
                
                // 创建筊杯
                createJiaoBei();
                
                // 启动动画
                animate();
                
                isInitialized = true;
                updateStatus('初始化完成！可以投掷筊杯了');
                updateDebug(`场景对象: ${scene.children.length}, 筊杯: ${jiaoBei.length}`);
                
            } catch (error) {
                updateStatus('初始化失败: ' + error.message);
                updateDebug('错误详情: ' + error.stack);
                console.error('初始化失败:', error);
            }
        }
        
        function createJiaoBei() {
            jiaoBei = [];
            
            for (let i = 0; i < 2; i++) {
                const group = new THREE.Group();
                
                // 筊杯主体 - 立方体
                const geometry = new THREE.BoxGeometry(0.8, 0.6, 0.8);
                const material = new THREE.MeshPhongMaterial({ 
                    color: 0xe74c3c,
                    transparent: true,
                    opacity: 0.9
                });
                const mesh = new THREE.Mesh(geometry, material);
                mesh.castShadow = true;
                mesh.receiveShadow = true;
                group.add(mesh);
                
                // 平面标识 - 金色圆盘
                const flatIndicator = new THREE.Mesh(
                    new THREE.CircleGeometry(0.25, 8),
                    new THREE.MeshBasicMaterial({ color: 0xf1c40f })
                );
                flatIndicator.rotation.x = -Math.PI / 2;
                flatIndicator.position.y = 0.4;
                group.add(flatIndicator);
                
                // 凸面标识 - 红色小球
                const convexIndicator = new THREE.Mesh(
                    new THREE.SphereGeometry(0.15, 6, 4),
                    new THREE.MeshBasicMaterial({ color: 0xe74c3c })
                );
                convexIndicator.position.y = -0.4;
                group.add(convexIndicator);
                
                // 设置位置
                group.position.set(i * 1.2 - 0.6, 1, 0);
                scene.add(group);
                jiaoBei.push(group);
            }
            
            updateDebug(`创建了 ${jiaoBei.length} 个筊杯`);
        }
        
        function throwJiaoBei() {
            if (!isInitialized || jiaoBei.length === 0) {
                updateStatus('筊杯未初始化，无法投掷');
                return;
            }
            
            updateStatus('投掷筊杯中...');
            
            jiaoBei.forEach((jiaoBei, index) => {
                const rotationX = (Math.random() - 0.5) * Math.PI * 2;
                const rotationY = (Math.random() - 0.5) * Math.PI * 2;
                const rotationZ = (Math.random() - 0.5) * Math.PI * 2;
                
                jiaoBei.rotation.set(rotationX, rotationY, rotationZ);
                
                updateDebug(`筊杯${index + 1} 旋转: X=${rotationX.toFixed(2)}, Y=${rotationY.toFixed(2)}, Z=${rotationZ.toFixed(2)}`);
            });
            
            updateStatus('投掷完成！');
        }
        
        function resetJiaoBei() {
            if (!isInitialized || jiaoBei.length === 0) {
                updateStatus('筊杯未初始化，无法重置');
                return;
            }
            
            jiaoBei.forEach(jiaoBei => {
                jiaoBei.rotation.set(0, 0, 0);
            });
            
            updateStatus('筊杯已重置');
            updateDebug('所有筊杯旋转已归零');
        }
        
        function animate() {
            if (!isInitialized) return;
            
            requestAnimationFrame(animate);
            
            // 相机轻微移动
            const time = Date.now() * 0.001;
            camera.position.x = Math.sin(time * 0.5) * 0.5;
            camera.position.z = 10 + Math.cos(time * 0.3) * 0.3;
            camera.lookAt(0, 0, 0);
            
            // 渲染场景
            if (renderer && scene && camera) {
                renderer.render(scene, camera);
            }
        }
        
        // 页面加载完成后初始化
        window.addEventListener('load', () => {
            updateStatus('页面加载完成，等待Three.js...');
            
            // 延迟初始化，确保Three.js加载完成
            setTimeout(() => {
                if (typeof THREE !== 'undefined') {
                    init();
                } else {
                    updateStatus('错误: Three.js 加载超时');
                    updateDebug('请检查网络连接或刷新页面');
                }
            }, 1000);
        });
        
        // 窗口大小改变时重新调整渲染器大小
        window.addEventListener('resize', () => {
            if (renderer && camera) {
                const container = document.getElementById('canvas');
                camera.aspect = container.clientWidth / container.clientHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(container.clientWidth, container.clientHeight);
            }
        });
    </script>
</body>
</html>
