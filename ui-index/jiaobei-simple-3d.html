<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>筊杯简单3D测试</title>
    <script src="https://unpkg.com/three@0.160.0/build/three.min.js"></script>
    <style>
        body {
            margin: 0;
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            font-family: 'Microsoft YaHei', sans-serif;
            color: white;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        .header {
            text-align: center;
            margin-bottom: 30px;
        }
        .preview-section {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
        }
        .preview-card {
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            padding: 20px;
        }
        .canvas-container {
            width: 100%;
            height: 400px;
            border-radius: 10px;
            overflow: hidden;
            background: #1a1a2e;
            position: relative;
        }
        .controls {
            margin-top: 20px;
            text-align: center;
        }
        .btn {
            background: linear-gradient(45deg, #ff6b6b, #ee5a24);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 25px;
            font-size: 16px;
            cursor: pointer;
            margin: 0 10px;
        }
        .status {
            margin-top: 10px;
            padding: 10px;
            background: rgba(0,0,0,0.3);
            border-radius: 5px;
            font-size: 12px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🥤 筊杯简单3D测试</h1>
            <p>使用基础几何体测试3D渲染</p>
        </div>
        
        <div class="preview-section">
            <div class="preview-card">
                <h3>🎯 当前设计（立方体）</h3>
                <div class="canvas-container">
                    <div id="currentCanvas"></div>
                </div>
                <div class="controls">
                    <button class="btn" onclick="rotateCurrent()">旋转测试</button>
                    <button class="btn" onclick="resetCurrent()">重置</button>
                </div>
                <div class="status" id="currentStatus">状态: 初始化中...</div>
            </div>
            
            <div class="preview-card">
                <h3>✨ 改进设计（圆柱体）</h3>
                <div class="canvas-container">
                    <div id="improvedCanvas"></div>
                </div>
                <div class="controls">
                    <button class="btn" onclick="rotateImproved()">旋转测试</button>
                    <button class="btn" onclick="resetImproved()">重置</button>
                </div>
                <div class="status" id="improvedStatus">状态: 初始化中...</div>
            </div>
        </div>
    </div>

    <script>
        let currentScene, currentCamera, currentRenderer, currentCube;
        let improvedScene, improvedCamera, improvedRenderer, improvedCylinder;
        
        function initCurrent() {
            console.log('初始化当前设计...');
            
            const container = document.getElementById('currentCanvas');
            
            // 创建场景
            currentScene = new THREE.Scene();
            currentScene.background = new THREE.Color(0x1a1a2e);
            
            // 创建相机
            currentCamera = new THREE.PerspectiveCamera(60, container.clientWidth / container.clientHeight, 0.1, 1000);
            currentCamera.position.set(0, 5, 10);
            currentCamera.lookAt(0, 0, 0);
            
            // 创建渲染器
            currentRenderer = new THREE.WebGLRenderer({ antialias: true });
            currentRenderer.setSize(container.clientWidth, container.clientHeight);
            container.appendChild(currentRenderer.domElement);
            
            // 添加光源
            const ambientLight = new THREE.AmbientLight(0x404040, 0.6);
            currentScene.add(ambientLight);
            
            const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
            directionalLight.position.set(10, 15, 10);
            currentScene.add(directionalLight);
            
            // 创建立方体
            const geometry = new THREE.BoxGeometry(2, 1.5, 2);
            const material = new THREE.MeshPhongMaterial({ color: 0xdc2626 });
            currentCube = new THREE.Mesh(geometry, material);
            currentScene.add(currentCube);
            
            // 开始动画
            animateCurrent();
            
            document.getElementById('currentStatus').textContent = '状态: 已就绪';
            console.log('当前设计初始化完成');
        }
        
        function initImproved() {
            console.log('初始化改进设计...');
            
            const container = document.getElementById('improvedCanvas');
            
            // 创建场景
            improvedScene = new THREE.Scene();
            improvedScene.background = new THREE.Color(0x1a1a2e);
            
            // 创建相机
            improvedCamera = new THREE.PerspectiveCamera(60, container.clientWidth / container.clientHeight, 0.1, 1000);
            improvedCamera.position.set(0, 5, 10);
            improvedCamera.lookAt(0, 0, 0);
            
            // 创建渲染器
            improvedRenderer = new THREE.WebGLRenderer({ antialias: true });
            improvedRenderer.setSize(container.clientWidth, container.clientHeight);
            container.appendChild(improvedRenderer.domElement);
            
            // 添加光源
            const ambientLight = new THREE.AmbientLight(0x404040, 0.6);
            improvedScene.add(ambientLight);
            
            const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
            directionalLight.position.set(10, 15, 10);
            improvedScene.add(directionalLight);
            
            // 创建圆柱体
            const geometry = new THREE.CylinderGeometry(1, 1, 1.5, 16);
            const material = new THREE.MeshPhongMaterial({ color: 0xdc2626 });
            improvedCylinder = new THREE.Mesh(geometry, material);
            improvedScene.add(improvedCylinder);
            
            // 开始动画
            animateImproved();
            
            document.getElementById('improvedStatus').textContent = '状态: 已就绪';
            console.log('改进设计初始化完成');
        }
        
        function rotateCurrent() {
            if (currentCube) {
                currentCube.rotation.x += Math.PI / 4;
                currentCube.rotation.y += Math.PI / 4;
                document.getElementById('currentStatus').textContent = '状态: 已旋转';
            }
        }
        
        function rotateImproved() {
            if (improvedCylinder) {
                improvedCylinder.rotation.x += Math.PI / 4;
                improvedCylinder.rotation.y += Math.PI / 4;
                document.getElementById('improvedStatus').textContent = '状态: 已旋转';
            }
        }
        
        function resetCurrent() {
            if (currentCube) {
                currentCube.rotation.set(0, 0, 0);
                document.getElementById('currentStatus').textContent = '状态: 已重置';
            }
        }
        
        function resetImproved() {
            if (improvedCylinder) {
                improvedCylinder.rotation.set(0, 0, 0);
                document.getElementById('improvedStatus').textContent = '状态: 已重置';
            }
        }
        
        function animateCurrent() {
            requestAnimationFrame(animateCurrent);
            if (currentRenderer && currentScene) {
                currentRenderer.render(currentScene, currentCamera);
            }
        }
        
        function animateImproved() {
            requestAnimationFrame(animateImproved);
            if (improvedRenderer && improvedScene) {
                improvedRenderer.render(improvedScene, improvedCamera);
            }
        }
        
        window.addEventListener('load', () => {
            console.log('页面加载完成，开始初始化...');
            setTimeout(() => {
                initCurrent();
                initImproved();
            }, 500);
        });
    </script>
</body>
</html>
